<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCMS Change Password</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="Change_Password.css">
</head>
<body>
<div class="dashboard">
    <aside class="sidebar">
        <div class="logo"><div class="logo-icon">◉</div><span>CCMS</span></div>
        <nav>
            <a href="#" data-route="Dashboard.html"><span>⌂</span>Dashboard</a>
            <a href="#" data-route="Submit_Complaint.html"><span>▣</span>Submit Complaint</a>
            <a href="#" data-route="My_Complaint.html"><span>▤</span>My Complaints</a>
            <a href="#" data-route="Profile.html"><span>♙</span>Profile</a>
            <a href="#" data-route="Change_Password.html" class="active"><span>⚿</span>Change Password</a>
            <a href="#logout"><span>↪</span>Logout</a>
        </nav>
    </aside>

    <main class="main">
        <header class="header">
            <div><p class="eyebrow">ACCOUNT SECURITY</p><h1>Change Password</h1></div>
            <a class="profile-icon" href="#" data-route="Profile.html" title="Open profile">👤</a>
        </header>

        <section class="password-card">
            <div class="card-heading"><h2>Update your password</h2><p>Choose a strong password you do not use elsewhere.</p></div>
            <form id="password-form">
                <label for="current-password">Current Password</label>
                <div class="password-field"><input id="current-password" name="currentPassword" type="password" required><button type="button" class="toggle-password" aria-label="Show current password"><i class="fa-regular fa-eye"></i></button></div>
                <label for="new-password">New Password</label>
                <div class="password-field"><input id="new-password" name="newPassword" type="password" minlength="6" required><button type="button" class="toggle-password" aria-label="Show new password"><i class="fa-regular fa-eye"></i></button></div>
                <label for="confirm-password">Confirm New Password</label>
                <div class="password-field"><input id="confirm-password" name="confirmPassword" type="password" minlength="6" required><button type="button" class="toggle-password" aria-label="Show confirmed password"><i class="fa-regular fa-eye"></i></button></div>
                <button class="save-button" type="submit">Save New Password</button>
                <p id="password-message" role="status"></p>
            </form>
        </section>
    </main>
</div>
<script src="app.js"></script>
<script>
    const passwordForm = document.getElementById('password-form');
    const passwordMessage = document.getElementById('password-message');
    document.querySelectorAll('.toggle-password').forEach((button) => button.addEventListener('click', () => {
        const input = button.previousElementSibling;
        const visible = input.type === 'text';
        input.type = visible ? 'password' : 'text';
        button.querySelector('i').classList.toggle('fa-eye', visible);
        button.querySelector('i').classList.toggle('fa-eye-slash', !visible);
        button.setAttribute('aria-label', visible ? 'Show password' : 'Hide password');
    }));
    passwordForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const current = passwordForm.currentPassword.value;
        const next = passwordForm.newPassword.value;
        const confirmation = passwordForm.confirmPassword.value;
        const stored = localStorage.getItem('rdecPassword') || '';
        if (next.length < 6) { passwordMessage.textContent = 'New password must be at least 6 characters.'; return; }
        if (next !== confirmation) { passwordMessage.textContent = 'New passwords do not match.'; return; }
        try {
            const result = await apiRequest('/me/password', { method: 'PATCH', body: JSON.stringify({ currentPassword: current, newPassword: next }) });
            passwordMessage.textContent = result.message;
        } catch (error) {
            passwordMessage.textContent = error.message;
            return;
        }
        passwordForm.reset();
    });
</script>
</body>
</html>
