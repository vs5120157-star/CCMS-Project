<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCMS Admin Registration</title>
    <link rel="stylesheet" href="Admin_Register.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
<div class="register-container">
    <section class="welcome-section">
        <div class="logo"><div class="logo-icon"><i class="fa-solid fa-shield-halved"></i></div><span>CCMS</span></div>
        <div class="welcome-content">
            <h1>Create Admin<br>Account</h1>
            <p>Register an administrator<br>to manage complaints.</p>
            <div class="admin-image"><img src="Admin.png" alt="Administrator using a laptop"></div>
        </div>
    </section>
    <section class="form-section">
        <div class="form-wrapper">
            <h2>Admin Registration</h2>
            <form id="admin-registration-form">
                <div class="form-group"><label for="admin-register-name">Full Name</label><input id="admin-register-name" name="name" type="text" autocomplete="name" placeholder="Enter full name" required></div>
                <div class="form-group"><label for="admin-register-email">Email</label><input id="admin-register-email" name="email" type="email" autocomplete="email" placeholder="Enter admin email" required></div>
                <div class="form-group"><label for="admin-register-phone">Phone Number</label><input id="admin-register-phone" name="phone" type="tel" autocomplete="tel" placeholder="Enter phone number" required></div>
                <div class="form-group"><label for="admin-register-password">Password</label><div class="password-box"><input id="admin-register-password" name="password" type="password" autocomplete="new-password" minlength="6" placeholder="Create password" required><button type="button" class="password-toggle" aria-label="Show password"><i class="fa-solid fa-eye"></i></button></div></div>
                <div class="form-group"><label for="admin-register-confirm">Confirm Password</label><div class="password-box"><input id="admin-register-confirm" name="confirmPassword" type="password" autocomplete="new-password" minlength="6" placeholder="Confirm password" required><button type="button" class="password-toggle" aria-label="Show password"><i class="fa-solid fa-eye"></i></button></div></div>
                <button class="register-btn" type="submit">Register now</button>
            </form>
            <p id="form-message" role="alert"></p>
            <p class="back-link"><a href="#" data-route="Admin_Login.html">Already registered? Admin Login</a></p>
        </div>
    </section>
</div>
<script src="app.js"></script>
<script>
    document.querySelectorAll('.password-toggle').forEach((button) => button.addEventListener('click', () => {
        const input = button.previousElementSibling;
        const visible = input.type === 'text';
        input.type = visible ? 'password' : 'text';
        button.querySelector('i').className = visible ? 'fa-solid fa-eye' : 'fa-solid fa-eye-slash';
        button.setAttribute('aria-label', visible ? 'Show password' : 'Hide password');
    }));
</script>
</body>
</html>
